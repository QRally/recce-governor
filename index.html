<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Service Park & Recce Speed Governor v1.8</title>
<style>
  :root {
    --bg-dark: #0f1115;
    --card-bg: #181b20;
    --border-color: #2a2e37;
    --text-main: #ffffff;
    --red-led: #ff2a2a;
    --red-glow: rgba(255, 42, 42, 0.4);
    --green-btn: #1b8a4c;
    --red-btn: #d32f2f;
    --blue-btn: #0277bd;
    --hq-banner-bg: #1c2333;
    --hq-banner-border: #3d5afe;
    --orange-accent: #ff9800;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 6px; overflow: hidden; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; font-weight: 700; font-size: 13px; letter-spacing: 0.5px; flex-shrink: 0; }
  .car-id-box { display: flex; align-items: center; gap: 4px; color: var(--orange-accent); font-weight: 900; }
  .car-input { background: #181b20; border: 1px solid var(--orange-accent); color: var(--orange-accent); font-size: 13px; font-weight: 900; width: 48px; border-radius: 4px; padding: 2px 4px; text-align: center; }
  .car-input:focus { outline: none; background: #000000; box-shadow: 0 0 5px var(--orange-accent); }
  .live-status { color: #00e676; display: flex; align-items: center; gap: 4px; }
  .battery { color: #cccccc; }

  /* Dashboard */
  .dashboard { flex: 1; display: flex; flex-direction: column; gap: 8px; margin-top: 2px; min-height: 0; }
  .telemetry-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; min-height: 0; }

  /* Speedometer */
  .speed-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 6px 2px; transition: background-color 0.3s, border-color 0.3s; }
  .speed-card.speed-breach { background: #3b0000; border-color: #ff1744; animation: flash-red 0.8s infinite alternate; }
  @keyframes flash-red { from { border-color: #ff1744; box-shadow: 0 0 10px #ff1744; } to { border-color: #7f0000; box-shadow: none; } }

  .speed-limit-badge { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #ff1744; background: #ffffff; color: #000000; font-weight: 900; font-size: 18px; display: flex; justify-content: center; align-items: center; margin-bottom: 4px; }
  .speed-val { font-size: 54px; font-weight: 900; line-height: 1; }
  .speed-unit { font-size: 12px; font-weight: 700; color: #888888; margin-top: 2px; }

  /* Trips */
  .trips-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; gap: 6px; }
  .trip-box { background: #0a0c0e; border: 1px solid #1f242d; border-radius: 8px; padding: 6px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; flex: 1; position: relative; overflow: hidden; }
  .led-display-window { width: 100%; background: #121418; border: 1px solid #252a34; border-radius: 6px; padding: 4px 0; margin: 2px 0; position: relative; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); overflow: hidden; }
  .trip-label { font-size: 9px; color: #888888; font-weight: 800; letter-spacing: 0.5px; }
  .trip-val-red { font-size: 30px; font-weight: 900; color: var(--red-led); text-shadow: 0 0 8px var(--red-glow); font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; line-height: 1; }
  .trip-btn { background: #2a2e37; color: #ffffff; border: none; border-radius: 4px; padding: 6px 6px; font-size: 9px; font-weight: 700; cursor: pointer; width: 100%; }
  .trip-btn:active { background: var(--orange-accent); color: #000000; }

  /* HQ Message Banner */
  .hq-banner { background: var(--hq-banner-bg); border: 1px solid var(--hq-banner-border); border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .hq-tag { background: var(--hq-banner-border); color: #ffffff; font-size: 9px; font-weight: 900; padding: 3px 5px; border-radius: 4px; letter-spacing: 0.5px; white-space: nowrap; }
  .hq-text { font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Action Buttons */
  .action-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; height: 85px; flex-shrink: 0; }
  .btn { border: none; border-radius: 10px; color: #ffffff; font-size: 15px; font-weight: 800; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; }
  .btn:active { opacity: 0.7; }
  .btn-ok { background: var(--green-btn); }
  .btn-fire { background: var(--red-btn); }
  .btn-medical { background: var(--blue-btn); }

  /* Footer */
  .footer { display: flex; justify-content: space-between; padding: 4px 4px 0 4px; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .status-flag { color: #00e676; }
  .status-sent { color: #888888; }
  .status-sent span { color: #ffffff; }
</style>
</head>
<body>

  <div class="header">
    <div class="car-id-box">
      <span>CAR #</span>
      <input type="text" id="car-num-input" class="car-input" value="15" maxlength="4" onchange="saveCarNumber()">
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="live-status">● LIVE</div>
    <div class="battery">100% ⚡</div>
  </div>

  <div class="dashboard">
    <div class="telemetry-row">
      <div class="speed-card" id="speed-card">
        <div class="speed-limit-badge" id="speed-limit">30</div>
        <div class="speed-val" id="speed">0.0</div>
        <div class="speed-unit">MPH</div>
      </div>

      <div class="trips-card">
        <div class="trip-box">
          <div class="trip-label">STAGE TRIP</div>
          <div class="led-display-window">
            <div class="trip-val-red" id="stage-trip">0.00</div>
          </div>
          <button class="trip-btn" onclick="resetStageTrip()">RESET (TAP)</button>
        </div>
        <div class="trip-box">
          <div class="trip-label">TOTAL TRIP</div>
          <div class="led-display-window">
            <div class="trip-val-red" id="total-trip">0.00</div>
          </div>
          <button class="trip-btn" onclick="resetTotalTrip()">RESET (TAP)</button>
        </div>
      </div>
    </div>

    <div class="hq-banner">
      <div class="hq-tag">HQ MSG</div>
      <div class="hq-text" id="hq-msg">CONNECTING TO HQ...</div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-ok" onclick="sendStatus('OK')">✓ OK</button>
      <button class="btn btn-fire" onclick="sendStatus('FIRE')">🔥 FIRE</button>
      <button class="btn btn-medical" onclick="sendStatus('MEDICAL')">+ MEDICAL</button>
    </div>
  </div>

  <div class="footer">
    <div class="status-flag">FIREBASE: <span id="sync-status" style="color:#00e5ff;">INITIALIZING</span></div>
    <div class="status-sent">Logs: <span id="log-count">0</span> | Last: <span id="last-sent">OK</span></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLi3NMmoJJCeJFGU4oeABpQyivQe1Z6i0",
      authDomain: "the-regulator-rally.firebaseapp.com",
      databaseURL: "https://the-regulator-rally-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "the-regulator-rally",
      storageBucket: "the-regulator-rally.firebasestorage.app",
      messagingSenderId: "1026958520151",
      appId: "1:1026958520151:web:1665550c6b9e3a8bf9d812"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // AUDIO SYSTEM SYNTHESIZER
    let audioCtx = null;
    let lastHqMessage = "";

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playHqMessageSound() {
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      
      // High Tone Beep 1
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(880, now);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.15);

      // Higher Tone Beep 2
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1174.66, now + 0.2);
      gain2.gain.setValueAtTime(0.3, now + 0.2);
      gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.2);
      osc2.stop(now + 0.4);
    }

    document.addEventListener('touchstart', initAudio, { once: true });
    document.addEventListener('click', initAudio, { once: true });

    // CONTROL ZONES
    const CONTROL_ZONES = [
      {
        name: "Service Park Zone",
        type: "POINT",
        center: [52.179099,-4.123709], 
        radiusMeters: 200,
        speedLimitMph: 30
      },
      {
        name: "SS1 Clocaenog Recce",
        type: "STAGE",
        startControl: [52.163310,-4.131737],
        finishControl: [52.147666,-4.111921],
        corridorBufferMeters: 100,
        speedLimitMph: 30
      }
    ];

    let currentSpeed = 0.0;
    let speedLimit = 30.0;
    let logCount = 0;
    let currentLat = 52.147673;
    let currentLng = -4.058082;
    let activeZoneName = "Service Park Zone";
    let activeBreach = false;

    // TRIP METERS TRACKING
    let lastLat = null;
    let lastLng = null;
    let stageTripMiles = 0.0;
    let totalTripMiles = 0.0;

    const carInputEl = document.getElementById("car-num-input");
    const storedCarNum = localStorage.getItem("rally_car_num");
    if (storedCarNum) carInputEl.value = storedCarNum;

    window.saveCarNumber = function() {
      const val = carInputEl.value.trim().toUpperCase() || '15';
      carInputEl.value = val;
      localStorage.setItem("rally_car_num", val);
    };

    function getCarId() {
      return carInputEl.value.trim().toUpperCase() || '15';
    }

    const syncStatusEl = document.getElementById("sync-status");
    const hqMsgEl = document.getElementById("hq-msg");
    const logCountEl = document.getElementById("log-count");
    const lastSentEl = document.getElementById("last-sent");

    // Distance in Meters (for Geofencing)
    function getDistanceMeters(p1, p2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (p2[0] - p1[0]) * rad;
      const dLon = (p2[1] - p1[1]) * rad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(p1[0] * rad) * Math.cos(p2[0] * rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // Distance in Miles (for Trip Meters)
    function getDistanceMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // Stage Line Distance
    function getDistanceToStageLine(carPos, startPos, finishPos) {
      const p = carPos, a = startPos, b = finishPos;
      const ab = [b[0] - a[0], b[1] - a[1]];
      const ap = [p[0] - a[0], p[1] - a[1]];
      const abLenSq = ab[0] * ab[0] + ab[1] * ab[1];
      
      if (abLenSq === 0) return getDistanceMeters(p, a);
      
      let t = (ap[0] * ab[0] + ap[1] * ab[1]) / abLenSq;
      t = Math.max(0, Math.min(1, t));
      
      const projection = [a[0] + t * ab[0], a[1] + t * ab[1]];
      return getDistanceMeters(p, projection);
    }

    // Geofence Evaluator
    function checkGeofences(lat, lng) {
      const currentPos = [lat, lng];
      let zoneFound = false;

      for (const zone of CONTROL_ZONES) {
        if (zone.type === "POINT") {
          const dist = getDistanceMeters(currentPos, zone.center);
          if (dist <= zone.radiusMeters) {
            activeZoneName = zone.name;
            speedLimit = zone.speedLimitMph;
            zoneFound = true;
            break;
          }
        } else if (zone.type === "STAGE") {
          const distToStage = getDistanceToStageLine(currentPos, zone.startControl, zone.finishControl);
          if (distToStage <= zone.corridorBufferMeters) {
            activeZoneName = zone.name;
            speedLimit = zone.speedLimitMph;
            zoneFound = true;
            break;
          }
        }
      }

      if (!zoneFound) {
        activeZoneName = "Liaison Route";
        speedLimit = 60.0;
      }

      document.getElementById('speed-limit').innerText = speedLimit;
      updateSpeedUI();
    }

    function updateClock() {
      document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    function updateSpeedUI() {
      document.getElementById('speed').innerText = currentSpeed.toFixed(1);
      const speedCard = document.getElementById('speed-card');
      const isBreaching = currentSpeed > speedLimit;

      if (isBreaching) {
        speedCard.classList.add('speed-breach');
        if (!activeBreach) {
          activeBreach = true;
          transmitTelemetryLog('SPEED_BREACH', 'OVER LIMIT');
        }
      } else {
        speedCard.classList.remove('speed-breach');
        activeBreach = false;
      }
    }

    async function transmitTelemetryLog(eventType = 'SPEED_BREACH', customStatus = null) {
      try {
        await addDoc(collection(db, "telemetry_logs"), {
          car_id: getCarId(),
          timestamp: serverTimestamp(),
          speed_kph: parseFloat((currentSpeed * 1.60934).toFixed(1)),
          speed_mph: parseFloat(currentSpeed.toFixed(1)),
          speed_limit_mph: speedLimit,
          speeding_breach: currentSpeed > speedLimit,
          zone: activeZoneName,
          event_type: eventType,
          status_value: customStatus,
          location: {
            lat: currentLat,
            lng: currentLng,
            formatted: `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`
          }
        });

        logCount++;
        logCountEl.innerText = logCount;
        syncStatusEl.innerText = "ONLINE";
        syncStatusEl.style.color = "#00e676";
      } catch (e) {
        console.error("Transmission error:", e);
        syncStatusEl.innerText = "RETRY";
        syncStatusEl.style.color = "#ff1744";
      }
    }

    window.sendStatus = function(type) {
      lastSentEl.innerText = type;
      transmitTelemetryLog('STATUS_ALERT', type);
    };

    window.resetStageTrip = function() { 
      stageTripMiles = 0.0; 
      document.getElementById('stage-trip').innerText = '0.00'; 
    };

    window.resetTotalTrip = function() { 
      totalTripMiles = 0.0; 
      document.getElementById('total-trip').innerText = '0.00'; 
    };

    // Continuous GPS Telemetry & Distance Accumulator
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        currentLat = lat;
        currentLng = lng;

        if (position.coords.speed !== null && position.coords.speed >= 0) {
          currentSpeed = position.coords.speed * 2.23694;
        }

        // Accumulate Trip Meters (Filter GPS noise below 25m accuracy)
        if (accuracy <= 25 && lastLat !== null && lastLng !== null) {
          const deltaMiles = getDistanceMiles(lastLat, lastLng, lat, lng);
          // 0.0018 miles = approx 3 meters threshold to prevent stationary jitter
          if (deltaMiles > 0.0018) {
            stageTripMiles += deltaMiles;
            totalTripMiles += deltaMiles;
            document.getElementById('stage-trip').innerText = stageTripMiles.toFixed(2);
            document.getElementById('total-trip').innerText = totalTripMiles.toFixed(2);
          }
        }

        lastLat = lat;
        lastLng = lng;

        checkGeofences(currentLat, currentLng);
      }, (err) => {
        checkGeofences(currentLat, currentLng);
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    } else {
      checkGeofences(currentLat, currentLng);
    }

    // HQ Broadcast Listener with Audio Alerts
    onSnapshot(doc(db, "control_logs", "hq_broadcast"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        const targetCar = String(data.target_car || 'ALL').toUpperCase();
        const myCar = getCarId();
        
        if (targetCar === 'ALL' || targetCar === myCar) {
          const msgText = (data.message || "RECCE MODE ACTIVE").toUpperCase();
          
          if (msgText !== lastHqMessage && msgText !== "RECCE MODE ACTIVE") {
            playHqMessageSound();
            lastHqMessage = msgText;
          }

          hqMsgEl.innerText = msgText;
        }
      }
    }, () => {
      hqMsgEl.innerText = "RECCE MODE ACTIVE";
    });

    syncStatusEl.innerText = "READY";
    syncStatusEl.style.color = "#00e5ff";
  </script>
</body>
</html>
